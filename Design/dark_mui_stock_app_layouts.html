<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dark MUI Stock App — 3 Layout Concepts</title>
<style>
:root{--bg:#0b1020;--paper:#121a2b;--paper2:#172237;--line:#27344b;--text:#e8eef8;--muted:#94a3b8;--primary:#8b9cff;--green:#45d6a0;--red:#ff7d91;--amber:#f5c36a;--radius:14px;font-family:Inter,Roboto,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#080d18;color:var(--text)}button{font:inherit;cursor:pointer}.top{padding:22px 26px 16px;border-bottom:1px solid #202b40;background:#0d1423;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.3px;font-size:18px}.brand span{color:var(--primary)}.sub{color:var(--muted);font-size:12px;margin-top:5px}.switches{display:flex;gap:8px;flex-wrap:wrap}.switch{background:#141e31;border:1px solid #2b3953;color:#c8d3e5;border-radius:10px;padding:10px 13px}.switch.active{background:#303e6a;border-color:#8b9cff;color:#fff}.hint{color:#93a1b8;font-size:12px;padding:12px 26px}.app{display:grid;grid-template-columns:218px 1fr;min-height:calc(100vh - 125px)}.sidebar{padding:20px 13px;background:#0d1423;border-right:1px solid #202b40}.sidebrand{padding:5px 12px 22px;font-size:13px;color:#7f91b1;text-transform:uppercase;letter-spacing:1.2px}.nav{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#9eacc3;text-align:left;padding:12px 13px;border-radius:10px;margin:3px 0}.nav.active{background:#263353;color:#fff}.ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin:35px 10px 0;padding-top:16px;border-top:1px solid #202b40;color:#71819b;font-size:11px;line-height:1.7}.main{padding:25px 27px 38px;min-width:0;max-width:1500px;width:100%;margin:auto}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:22px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--primary);font-weight:700}.h1{font-size:27px;font-weight:750;margin:6px 0}.desc{font-size:13px;color:var(--muted)}.btn{border:1px solid #34425c;background:#1a2740;color:#e9efff;padding:10px 13px;border-radius:9px}.btn.primary{background:#8293ff;color:#0a1020;border-color:#8293ff;font-weight:700}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.two{grid-template-columns:minmax(0,1.4fr) minmax(270px,.8fr)}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel,.stat{background:linear-gradient(145deg,#151f33,#111a2a);border:1px solid var(--line);border-radius:var(--radius);padding:17px;min-width:0}.statlabel{font-size:12px;color:#9baac0}.statvalue{font-size:25px;font-weight:750;margin:10px 0 7px;letter-spacing:-.5px}.positive{color:var(--green)}.negative{color:var(--red)}.muted{color:var(--muted)}.small{font-size:11px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.paneltitle{font-size:14px;font-weight:700}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 8px;background:#193b37;color:#67e2b8;font-size:11px;white-space:nowrap}.pill.warn{background:#493a24;color:#f5c36a}.pill.bad{background:#452733;color:#ff9aac}.chart{height:190px;position:relative;overflow:hidden;border-radius:9px;background:linear-gradient(180deg,rgba(139,156,255,.08),transparent)}.chart svg{width:100%;height:100%}.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin-top:9px}.legend b{display:inline-block;width:7px;height:7px;background:var(--primary);border-radius:50%;margin-right:5px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th{text-align:left;color:#8fa0b9;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.65px;padding:11px 9px;border-bottom:1px solid #2a3850}td{padding:12px 9px;border-bottom:1px solid #202c40}tr:last-child td{border-bottom:0}.ticker{font-weight:750}.company{display:block;color:#8291a9;font-size:10px;margin-top:3px}.right{text-align:right}.bar{height:6px;border-radius:8px;background:#283650;overflow:hidden;min-width:65px}.bar span{display:block;height:100%;background:#8798ff;border-radius:8px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #202c40}.row:last-child{border-bottom:0}.asset{display:flex;align-items:center;gap:10px}.coin{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#263451;color:#b9c7ff;font-weight:800;font-size:11px}.tag{font-size:10px;padding:4px 7px;border-radius:6px;background:#202e48;color:#aebde0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.input{background:#0d1525;border:1px solid #2a3850;color:#c7d4e9;padding:10px 12px;border-radius:9px;font-size:12px;min-width:160px}.cardsmall{padding:14px}.score{font-size:20px;font-weight:800;color:var(--green)}.layout-label{display:inline-block;padding:5px 8px;border-radius:7px;background:#273353;color:#cbd4ff;font-size:10px;margin-bottom:8px}.watchgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.watchitem{background:#121d30;border:1px solid #293851;border-radius:12px;padding:15px}.watchtop{display:flex;justify-content:space-between;gap:8px}.spark{height:36px;margin-top:12px}.spark svg{height:100%;width:100%}.footer-note{font-size:11px;color:#71819b;margin-top:18px}
/* concept-specific */
body.compact .app{grid-template-columns:190px 1fr}body.compact .main{padding:20px}body.compact .panel,body.compact .stat{border-radius:9px;padding:13px}body.compact .stats{gap:10px}body.compact td{padding:9px 7px}body.cards .app{grid-template-columns:76px 1fr}body.cards .sidebar{padding:18px 9px}body.cards .sidebrand{font-size:0;text-align:center;padding:5px 0 22px}body.cards .sidebrand:after{content:'◈';font-size:22px;color:var(--primary)}body.cards .nav{justify-content:center;padding:13px 5px;font-size:0}body.cards .ico{font-size:18px}body.cards .sidefoot{display:none}body.cards .panel,body.cards .stat{background:#141f33;border-radius:18px}body.cards .stats{grid-template-columns:repeat(2,minmax(0,1fr))}body.cards .watchgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:900px){.app{grid-template-columns:70px 1fr}.sidebrand{font-size:0;text-align:center;padding:5px 0 22px}.sidebrand:after{content:'◈';font-size:22px;color:var(--primary)}.nav{justify-content:center;padding:13px 5px;font-size:0}.ico{font-size:18px}.sidefoot{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}.watchgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:18px}.h1{font-size:23px}}@media(max-width:540px){.top{padding:16px}.stats{grid-template-columns:1fr 1fr}.watchgrid{grid-template-columns:1fr}.statvalue{font-size:21px}.main{padding:13px}.heading{margin-bottom:16px}.switch{padding:8px;font-size:12px}}
</style></head><body class="pro">
<header class="top"><div><div class="brand">◈ <span>MARKET</span>DESK</div><div class="sub">Dark MUI-inspired stock research workspace · layout concepts</div></div><div class="switches"><button class="switch active" data-layout="pro">1 · Professional</button><button class="switch" data-layout="compact">2 · Data dense</button><button class="switch" data-layout="cards">3 · Card-based</button></div></header>
<div class="hint">Choose a layout above, then use the left navigation to preview Dashboard, Portfolio, Scans and Watchlist. This is a visual prototype, not connected to live market data.</div>
<div class="app"><aside class="sidebar"><div class="sidebrand">Workspace</div><button class="nav active" data-page="Dashboard"><span class="ico">▦</span>Dashboard</button><button class="nav" data-page="Portfolio"><span class="ico">◫</span>Portfolio</button><button class="nav" data-page="Scans"><span class="ico">⌕</span>Scans</button><button class="nav" data-page="Watchlist"><span class="ico">☆</span>Watchlist</button><div class="sidefoot">MARKETDESK<br>Research workspace<br><br><span class="pill">● Demo mode</span></div></aside><main class="main" id="content"></main></div>
<script>
const stocks=[['NVDA','NVIDIA','$182.42','+2.84%','Semiconductors'],['MSFT','Microsoft','$524.18','+0.92%','Software'],['GOOGL','Alphabet','$248.70','+1.35%','Internet'],['AVGO','Broadcom','$371.22','−0.44%','Semiconductors'],['TSM','TSMC','$298.50','+1.72%','Semiconductors']];
let page='Dashboard';
const fmt=(x)=>x;
function table(rows=stocks,scan=false){return `<div class="tablewrap"><table><thead><tr><th>Company</th><th>Price</th><th>Day change</th>${scan?'<th>RSI</th><th>Score</th><th>Signal</th>':'<th>Sector</th>'}</tr></thead><tbody>${rows.map((s,i)=>`<tr><td><span class="ticker">${s[0]}</span><span class="company">${s[1]}</span></td><td>${s[2]}</td><td class="${s[3].startsWith('+')?'positive':'negative'}">${s[3]}</td>${scan?`<td>${[34,41,38,46,29][i]}</td><td class="positive">${[9.4,8.8,9.1,8.7,9.2][i].toFixed(1)}/10</td><td><span class="pill">Strong</span></td>`:`<td class="muted">${s[4]}</td>`}</tr>`).join('')}</tbody></table></div>`}
function chart(){return `<div class="chart"><svg viewBox="0 0 700 190" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b9cff" stop-opacity=".28"/><stop offset="1" stop-color="#8b9cff" stop-opacity="0"/></linearGradient></defs>${[35,75,115,155].map(y=>`<line x1="0" y1="${y}" x2="700" y2="${y}" stroke="#26344b" stroke-dasharray="4 5"/>`).join('')}<path d="M0 150 L35 135 L70 142 L105 115 L140 124 L175 96 L210 109 L245 78 L280 91 L315 62 L350 82 L385 70 L420 84 L455 48 L490 57 L525 35 L560 52 L595 30 L630 40 L665 19 L700 25 L700 190 L0 190Z" fill="url(#fill)"/><path d="M0 150 L35 135 L70 142 L105 115 L140 124 L175 96 L210 109 L245 78 L280 91 L315 62 L350 82 L385 70 L420 84 L455 48 L490 57 L525 35 L560 52 L595 30 L630 40 L665 19 L700 25" fill="none" stroke="#8b9cff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`}
function stat(label,value,delta,cls='positive'){return `<div class="stat"><div class="statlabel">${label}</div><div class="statvalue">${value}</div><div class="small ${cls}">${delta}</div></div>`}
function panel(title,body,action='View all'){return `<section class="panel"><div class="panelhead"><div class="paneltitle">${title}</div><button class="btn">${action} ↗</button></div>${body}</section>`}
function heading(title,desc,button='＋ Add new'){return `<div class="heading"><div><div class="eyebrow">Your workspace / ${title}</div><div class="h1">${title}</div><div class="desc">${desc}</div></div><button class="btn primary">${button}</button></div>`}
function dashboard(){return `${heading('Dashboard','Market overview, portfolio performance and your latest signals.','↻ Refresh overview')}<div class="grid stats">${stat('Portfolio value','$248,650','↗ 3.82% this month')}${stat('Today’s P/L','+$1,284','+0.52% today')}${stat('Open positions','12','Across 4 sectors','')}${stat('Active scan signals','08','3 new since last scan','')}</div><div class="grid two" style="margin-bottom:15px">${panel('Portfolio performance <span class="muted">· 1M</span>',chart()+'<div class="legend"><span><b></b>Portfolio</span><span>Benchmark: S&P 500</span><span class="positive">+3.82%</span></div>','1M ▾')}${panel('Market pulse',`<div class="row"><div><div class="ticker">S&P 500</div><div class="small muted">US large caps</div></div><div class="right"><div class="ticker">6,742.18</div><div class="small positive">+0.64%</div></div></div><div class="row"><div><div class="ticker">NASDAQ</div><div class="small muted">Technology</div></div><div class="right"><div class="ticker">22,914.60</div><div class="small positive">+1.12%</div></div></div><div class="row"><div><div class="ticker">ASX 200</div><div class="small muted">Australia</div></div><div class="right"><div class="ticker">8,921.30</div><div class="small negative">−0.18%</div></div></div><div class="row"><span class="muted small">Last scan</span><span class="small">Today, 4:05 pm</span></div>`,'Market details')}</div><div class="grid two">${panel('Top holdings',table(stocks.slice(0,4)),'Portfolio')}${panel('Latest scan signals',table(stocks.slice(0,4),true),'All scans')}</div>`}
function portfolio(){return `${heading('Portfolio','Track holdings, cost base, exposure and performance.','＋ Add holding')}<div class="grid stats">${stat('Total market value','$248,650','Across 12 positions')}${stat('Total return','+$28,420','+12.90% all time')}${stat('Today’s change','+$1,284','+0.52% today')}${stat('Cash available','$42,500','17.1% of account','')}</div><div class="grid two" style="margin-bottom:15px">${panel('Account performance',chart()+'<div class="legend"><span><b></b>Portfolio value</span><span class="positive">+12.90% total return</span></div>','6M ▾')}${panel('Sector allocation',`<div class="row"><span>Semiconductors</span><b>38%</b></div><div class="bar"><span style="width:38%"></span></div><div class="row"><span>Software & cloud</span><b>26%</b></div><div class="bar"><span style="width:26%"></span></div><div class="row"><span>Internet platforms</span><b>18%</b></div><div class="bar"><span style="width:18%"></span></div><div class="row"><span>Other</span><b>18%</b></div><div class="bar"><span style="width:18%"></span></div>`,'View allocation')}</div>${panel('Your holdings',`<div class="filters"><input class="input" placeholder="⌕ Search ticker or company"><select class="input"><option>All sectors</option><option>Semiconductors</option></select><select class="input"><option>Sort: Market value</option><option>Sort: Daily change</option></select></div>${table(stocks.concat([['AMAT','Applied Materials','$226.10','+0.76%','Semiconductors'],['PANW','Palo Alto Networks','$205.82','−0.31%','Cybersecurity']]))}`,'Export CSV')}`}
function scans(){return `${heading('Scans','Find stocks matching your rules and review new signals.','＋ New scan rule')}<div class="grid stats">${stat('Matching stocks','24','Across your active rules')}${stat('New today','08','3 high conviction')}${stat('Strong Buy signals','06','GARP + momentum')}${stat('Last completed','4:05 pm','Scan finished successfully','')}</div><div class="filters"><input class="input" placeholder="⌕ Search ticker or company"><select class="input"><option>All scan rules</option><option>GARP + quality</option><option>Trend following</option></select><select class="input"><option>All signals</option><option>Strong Buy</option><option>Watch</option></select><button class="btn">⚙ Filters</button></div><div class="grid two" style="margin-bottom:15px"><div class="panel"><div class="panelhead"><div class="paneltitle">Active scan rules</div><span class="pill">3 enabled</span></div><div class="row"><div><b>GARP + Quality</b><div class="small muted">EPS growth &gt; 20% · ROE &gt; 15% · PEG &lt; 1.5</div></div><span class="tag">12 matches</span></div><div class="row"><div><b>Trend continuation</b><div class="small muted">Price &gt; EMA21 &gt; EMA63 · volume filter</div></div><span class="tag">8 matches</span></div><div class="row"><div><b>Oversold quality</b><div class="small muted">Strong fundamentals · RSI below 40</div></div><span class="tag">4 matches</span></div></div>${panel('Signal mix',`<div class="row"><span>Strong Buy</span><b class="positive">6</b></div><div class="bar"><span style="width:25%"></span></div><div class="row"><span>Watch</span><b>13</b></div><div class="bar"><span style="width:54%;background:#f5c36a"></span></div><div class="row"><span>Needs review</span><b class="negative">5</b></div><div class="bar"><span style="width:21%;background:#ff7d91"></span></div>`,'Scan history')}</div></div>${panel('Scan results',table(stocks,true),'Download results')}`}
function watchlist(){return `${heading('Watchlist','Keep an eye on your highest-priority stocks and entry levels.','＋ Add ticker')}<div class="filters"><input class="input" placeholder="⌕ Find a stock…"><select class="input"><option>My watchlist</option><option>AI & semiconductors</option><option>Long-term GARP</option></select><button class="btn">＋ New list</button></div><div class="watchgrid">${stocks.concat([['ASML','ASML Holding','$1,042.20','+0.88%','Semiconductors']]).map((s,i)=>`<div class="watchitem"><div class="watchtop"><div class="asset"><div class="coin">${s[0].slice(0,2)}</div><div><div class="ticker">${s[0]}</div><div class="small muted">${s[1]}</div></div></div><button class="btn" style="padding:4px 8px">☆</button></div><div class="statvalue" style="font-size:22px;margin:17px 0 5px">${s[2]}</div><div class="small ${s[3].startsWith('+')?'positive':'negative'}">${s[3]} <span class="muted">today</span></div><div class="spark"><svg viewBox="0 0 200 36" preserveAspectRatio="none"><polyline points="0,29 20,25 40,28 60,13 80,19 100,10 120,17 140,8 160,12 180,3 200,6" fill="none" stroke="${s[3].startsWith('+')?'#45d6a0':'#ff7d91'}" stroke-width="2.2"/></svg></div><div class="row"><span class="small muted">Sector</span><span class="tag">${s[4]}</span></div><div class="row"><span class="small muted">My note</span><span class="small">Review entry</span></div></div>`).join('')}</div><div class="footer-note">Tip: use notes for your target price, thesis and what would invalidate the idea.</div>`}
function render(){document.getElementById('content').innerHTML=({Dashboard:dashboard,Portfolio:portfolio,Scans:scans,Watchlist:watchlist}[page])();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
document.querySelectorAll('.switch').forEach(b=>b.addEventListener('click',()=>{document.body.className=b.dataset.layout;document.querySelectorAll('.switch').forEach(x=>x.classList.toggle('active',x===b));}));document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));render();
</script></body></html>
