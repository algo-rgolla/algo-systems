th:1600px;margin:0 auto;padding:14px 30px 48px;min-width:0}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}.page-title{font-size:20px;letter-spacing:-.3px;margin:0;font-weight:750}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #34435e;background:#18253b;color:#e6edfb;padding:10px 13px;border-radius:9px;font-size:12px;white-space:nowrap}.btn:hover{filter:brightness(1.12)}.btn.primary{background:var(--primary);color:#10162a;border-color:var(--primary);font-weight:750}.grid{display:grid;gap:16px;min-width:0}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.two{grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);margin-bottom:16px}.panel,.stat{min-width:0;background:linear-gradient(145deg,#151f33,#111a2a);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 9px 25px #00000012}.stat-label{font-size:12px;color:#a3b0c4}.stat-value{font-size:25px;font-weight:780;letter-spacing:-.5px;margin:12px 0 7px;overflow-wrap:anywhere}.positive{color:var(--green)}.negative{color:var(--red)}.muted{color:var(--muted)}.small{font-size:11px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel-title{font-weight:750;font-size:14px}.panel-link{border:0;background:transparent;color:var(--primary);font-size:11px;white-space:nowrap}.chart{height:205px;width:100%;overflow:hidden;border-radius:9px;background:linear-gradient(180deg,#91a0ff12,transparent)}.chart svg{width:100%;height:100%;display:block}.legend{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:11px}.legend-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);display:inline-block;margin-right:5px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #253149}.row:first-child{padding-top:3px}.row:last-child{border-bottom:0;padding-bottom:2px}.right{text-align:right}.ticker{font-weight:780;letter-spacing:.15px}.company{display:block;color:#8999b2;font-size:10px;margin-top:4px}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:5px 8px;background:#193b37;color:#67e2b8;font-size:10px;white-space:nowrap}.pill.warn{background:#493a24;color:var(--amber)}.pill.bad{background:#452733;color:#ff9aac}.table-wrap{width:100%;overflow-x:auto;border-radius:9px;overscroll-behavior-x:contain}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th{text-align:left;color:#8fa0b9;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:12px 10px;border-bottom:1px solid #2a3850}td{padding:13px 10px;border-bottom:1px solid #202c40}tbody tr:hover{background:#ffffff05}tr:last-child td{border-bottom:0}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.input{background:#0d1525;border:1px solid #2a3850;color:#d8e1f2;padding:10px 12px;border-radius:9px;font-size:12px;min-width:150px;max-width:100%}.watch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.watch-card{background:#121d30;border:1px solid #293851;border-radius:13px;padding:16px;min-width:0}.watch-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.asset{display:flex;align-items:center;gap:10px;min-width:0}.coin{display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:11px;background:#263451;color:#c4ceff;font-weight:800;font-size:11px}.watch-price{font-size:23px;font-weight:780;margin:17px 0 5px;letter-spacing:-.5px}.candles{height:280px;margin:14px 0 4px}.bar{height:6px;border-radius:8px;background:#283650;overflow:hidden}.bar span{display:block;height:100%;background:var(--primary);border-radius:8px}.section-gap{margin-top:16px}.empty-note{color:var(--muted);font-size:11px;margin-top:17px}

@media(max-width:700px){body{font-size:13px}.topbar{height:60px;padding:0 15px}.brand{font-size:16px}.status{display:none}.app{display:block;min-height:calc(100vh - 60px)}.sidebar{display:none}.main{padding:12px 14px 94px}.page-heading{gap:12px;flex-direction:column;margin-bottom:17px}.heading-row{width:100%}.page-title{font-size:18px}.actions{width:100%}.actions .btn{flex:1}.stats{gap:10px;margin-bottom:12px}.stat{padding:13px;border-radius:12px}.stat-label{font-size:11px}.stat-value{font-size:21px;margin:9px 0 6px}.panel{padding:14px;border-radius:13px}.grid{gap:12px}.two{gap:12px;margin-bottom:12px}.panel-head{margin-bottom:11px}.panel-title{font-size:13px}.chart{height:165px}.legend{gap:9px}.table-wrap{margin-right:-2px}table{font-size:11px}th{padding:10px 9px;font-size:9px}td{padding:11px 9px}.company{font-size:10px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters .input:first-child{grid-column:1/-1;width:100%}.filters .btn{width:100%}.watch-grid{grid-template-columns:1fr;gap:10px}.candles{height:220px}.watch-card{padding:14px}.watch-price{font-size:22px}.mobile-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:7px 7px max(7px,env(safe-area-inset-bottom));background:#0d1423f5;border-top:1px solid #2a3850;backdrop-filter:blur(14px)}.mobile-nav .nav{margin:0;display:flex;flex-direction:column;gap:4px;justify-content:center;align-items:center;text-align:center;padding:7px 1px;border-radius:9px;font-size:9px;min-width:0;min-height:49px}.mobile-nav .nav-icon{font-size:17px;width:auto}.mobile-nav .nav.active{box-shadow:none;background:#263353;color:#fff}.mobile-nav .nav.active .nav-icon{color:var(--primary)}.empty-note{line-height:1.5}}
@media(max-width:380px){.main{padding-left:10px;padding-right:10px}.topbar{padding:0 11px}.stats{gap:8px}.stat{padding:11px}.stat-value{font-size:19px}.page-title{font-size:18px}.btn{padding:9px 10px}.panel{padding:12px}}

<body>
<header class="topbar"><div class="brand"><span class="brand-mark">◈</span>ALGO <span>SYSTEMS</span></div><div class="top-right"><div class="avatar" aria-label="User profile">U</div></div></header>
<div class="app"><aside class="sidebar"><nav id="desktopNav"><button class="nav active" data-page="Dashboard"><span class="nav-icon">▦</span>Dashboard</button><button class="nav" data-page="Portfolio"><span class="nav-icon">◫</span>Portfolio</button><button class="nav" data-page="PortfolioHistory"><span class="nav-icon">↗</span>Portfolio History</button><button class="nav" data-page="Scans"><span class="nav-icon">⌕</span>Stock Scans</button><button class="nav" data-page="Watchlist"><span class="nav-icon">☆</span>Watchlist</button></nav><div class="sidebar-bottom">ALGO SYSTEMS</div></aside><main class="main" id="content" aria-live="polite"></main></div>
<nav class="mobile-nav" id="mobileNav" aria-label="Main navigation"><button class="nav active" data-page="Dashboard"><span class="nav-icon">▦</span>Dashboard</button><button class="nav" data-page="Portfolio"><span class="nav-icon">◫</span>Portfolio</button><button class="nav" data-page="PortfolioHistory"><span class="nav-icon">↗</span>Portfolio History</button><button class="nav" data-page="Scans"><span class="nav-icon">⌕</span>Stock Scans</button><button class="nav" data-page="Watchlist"><span class="nav-icon">☆</span>Watchlist</button></nav>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script>
const stocks=[['NVDA','NVIDIA','$182.42','+2.84%','Semiconductors'],['MSFT','Microsoft','$524.18','+0.92%','Software'],['GOOGL','Alphabet','$248.70','+1.35%','Internet'],['AVGO','Broadcom','$371.22','−0.44%','Semiconductors'],['TSM','TSMC','$298.50','+1.72%','Semiconductors'],['AMAT','Applied Materials','$226.10','+0.76%','Semiconductors'],['PANW','Palo Alto Networks','$205.82','−0.31%','Cybersecurity']];let currentPage='Dashboard';
const isUp=s=>s[3].startsWith('+');
function statStrip(items){return `<div class="stat-strip">${items.map(([label,value,delta,cls='positive'])=>`<div class="strip-cell"><div class="strip-label">${label}</div><div class="strip-value"><b>${value}</b><span class="${cls}">${delta}</span></div></div>`).join('')}</div>`}
function stat(label,value,delta,cls='positive'){return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="small ${cls}">${delta}</div></div>`}
function panel(title,body,action='View all'){return `<section class="panel"><div class="panel-head"><div class="panel-title">${title}</div><button class="panel-link" data-go="${action==='Portfolio'?'Portfolio':action==='All scans'?'Scans':'Watchlist'}">${action} ↗</button></div>${body}</section>`}
function heading(title,button='＋ Add new'){return `<div class="page-heading"><div class="heading-row"><h1 class="page-title">${title}</h1></div>${button?`<div class="actions"><button class="btn primary" data-action="${button}">${button}</button></div>`:''}</div>`}
function table(rows=stocks,scan=false){return `<div class="table-wrap"><table><thead><tr><th>Stock</th><th>Price</th><th>Day change</th>${scan?'<th>RSI</th><th>Score</th><th>Signal</th>':'<th>Sector</th>'}</tr></thead><tbody>${rows.map((s,i)=>`<tr><td><span class="ticker">${s[0]}</span><span class="company">${s[1]}</span></td><td>${s[2]}</td><td class="${isUp(s)?'positive':'negative'}">${s[3]}</td>${scan?`<td>${[34,41,38,46,29,36,43][i%7]}</td><td class="positive">${[9.4,8.8,9.1,8.7,9.2,8.6,8.5][i%7].toFixed(1)}/10</td><td><span class="pill">Strong</span></td>`:`<td class="muted">${s[4]}</td>`}</tr>`).join('')}</tbody></table></div>`}
function chart(){return `<div class="chart"><svg viewBox="0 0 700 205" preserveAspectRatio="none" role="img" aria-label="Portfolio performance chart"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#91a0ff" stop-opacity=".27"/><stop offset="1" stop-color="#91a0ff" stop-opacity="0"/></linearGradient></defs>${[35,78,121,164].map(y=>`<line x1="0" y1="${y}" x2="700" y2="${y}" stroke="#293750" stroke-dasharray="4 5"/>`).join('')}<path d="M0 166 L35 150 L70 155 L105 126 L140 135 L175 103 L210 115 L245 85 L280 96 L315 66 L350 83 L385 72 L420 88 L455 52 L490 61 L525 39 L560 55 L595 32 L630 43 L665 20 L700 28 L700 205 L0 205Z" fill="url(#chartFill)"/><path d="M0 166 L35 150 L70 155 L105 126 L140 135 L175 103 L210 115 L245 85 L280 96 L315 66 L350 83 L385 72 L420 88 L455 52 L490 61 L525 39 L560 55 L595 32 L630 43 L665 20 L700 28" fill="none" stroke="#91a0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`}
function dashboard(){return `${heading('Dashboard',null)}<section class="panel" style="margin-bottom:16px"><div class="panel-head" style="margin-bottom:11px"><div class="panel-title">Today’s scans</div><button class="panel-link" data-go="Scans">All scans ↗</button></div><div class="scan-type-grid">${scanTypes.map(([name,icon,desc])=>`<button class="scan-type" data-open-scan="${name}" title="${desc}" aria-label="Open ${name} scan, ${scanSets[name].length} results"><span class="scan-type-icon">${icon}</span><span class="scan-type-name">${name}</span><span class="scan-type-count">${scanSets[name].length} results →</span></button>`).join('')}</div></section><section class="panel"><div class="panel-head"><div class="panel-title">Market data</div></div><div class="tradingview-widget-container market-data" id="marketData"><div class="tradingview-widget-container__widget"></div><div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">Market data by TradingView</a></div></div></section>`}
function portfolio(){return `${heading('Portfolio','＋ Add holding')}${statStrip([['Total market value','$248,650','Across 12 positions','muted'],['Total return','+$28,420','+12.90% all time'],['Today’s change','+$1,284','+0.52% today'],['Cash available','$42,500','17.1% of account','muted']])}<section class="panel" style="margin-bottom:16px"><div id="portfolioTable">${table(stocks.concat([['ASML','ASML Holding','$1,042.20','+0.88%','Semiconductors']]))}</div></section><div class="grid two"><section class="panel"><div class="panel-head"><div class="panel-title">Account performance</div><button class="panel-link">6M ▾</button></div>${chart()}<div class="legend"><span><i class="legend-dot"></i>Portfolio value</span><span class="positive">+12.90% total return</span></div></section><section class="panel"><div class="panel-head"><div class="panel-title">Sector allocation</div></div>${[['Semiconductors',38],['Software & cloud',26],['Internet platforms',18],['Other',18]].map(([n,v])=>`<div class="row"><span>${n}</span><b>${v}%</b></div><div class="bar"><span style="width:${v}%"></span></div>`).join('')}</section></div>`}

const closedTrades=[
  {ticker:'NVDA',company:'NVIDIA',side:'Long',entry:'2026-10-02',exit:'2026-10-21',hold:'19 days',qty:25,entryPrice:168.40,exitPrice:182.42,pnl:350.50,returnPct:8.32},
  {ticker:'MSFT',company:'Microsoft',side:'Long',entry:'2026-09-18',exit:'2026-10-16',hold:'28 days',qty:10,entryPrice:492.00,exitPrice:521.30,pnl:293.00,returnPct:5.96},
  {ticker:'AVGO',company:'Broadcom',side:'Long',entry:'2026-09-29',exit:'2026-10-14',hold:'15 days',qty:12,entryPrice:389.00,exitPrice:371.22,pnl:-213.36,returnPct:-4.57},
  {ticker:'TSM',company:'TSMC',side:'Long',entry:'2026-09-04',exit:'2026-10-09',hold:'35 days',qty:15,entryPrice:274.50,exitPrice:298.50,pnl:360.00,returnPct:8.74},
  {ticker:'GOOGL',company:'Alphabet',side:'Long',entry:'2026-09-22',exit:'2026-10-07',hold:'15 days',qty:20,entryPrice:254.20,exitPrice:248.70,pnl:-110.00,returnPct:-2.16},
  {ticker:'AMAT',company:'Applied Materials',side:'Long',entry:'2026-08-28',exit:'2026-10-01',hold:'34 days',qty:8,entryPrice:205.00,exitPrice:226.10,pnl:168.80,returnPct:10.29},
  {ticker:'PANW',company:'Palo Alto Networks',side:'Long',entry:'2026-09-11',exit:'2026-09-26',hold:'15 days',qty:18,entryPrice:214.00,exitPrice:205.82,pnl:-147.24,returnPct:-3.82},
  {ticker:'ASML',company:'ASML Holding',side:'Long',entry:'2026-08-05',exit:'2026-09-19',hold:'45 days',qty:4,entryPrice:988.00,exitPrice:1042.20,pnl:216.80,returnPct:5.49}
];
function money(v){return `${v<0?'−':'+'}$${Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`}
function portfolioHistory(){
 const wins=closedTrades.filter(t=>t.pnl>0).length, losses=closedTrades.filter(t=>t.pnl<0).length;
 const net=closedTrades.reduce((sum,t)=>sum+t.pnl,0);
 const grossWins=closedTrades.filter(t=>t.pnl>0).reduce((sum,t)=>sum+t.pnl,0);
 const grossLosses=Math.abs(closedTrades.filter(t=>t.pnl<0).reduce((sum,t)=>sum+t.pnl,0));
 const winRate=Math.round(wins/closedTrades.length*100);
 const avgWin=grossWins/wins, avgLoss=grossLosses/losses;
 const rows=closedTrades.map(t=>`<tr><td><span class="ticker">${t.ticker}</span><span class="company">${t.company}</span></td><td><span class="pill">${t.side}</span></td><td>${t.entry}</td><td>${t.exit}</td><td class="right">${t.qty}</td><td class="right">$${t.entryPrice.toFixed(2)}</td><td class="right">$${t.exitPrice.toFixed(2)}</td><td class="${t.pnl>=0?'positive':'negative'} right">${money(t.pnl)}</td><td class="${t.returnPct>=0?'positive':'negative'} right">${t.returnPct>=0?'+':''}${t.returnPct.toFixed(2)}%</td><td><span class="pill ${t.pnl<0?'bad':''}">${t.pnl>0?'Win':'Loss'}</span></td></tr>`).join('');
 return `${heading('Portfolio History',null)}
 ${statStrip([
  ['Realised P/L',money(net),`${net>=0?'Net profit':'Net loss'} · ${closedTrades.length} trades`,net>=0?'positive':'negative'],
  ['Closed trades',closedTrades.length,'Completed positions','muted'],
  ['Win rate',`${winRate}%`,`${wins} wins · ${losses} losses`,'muted'],
  ['Profit factor',(grossWins/grossLosses).toFixed(2),`Avg win ${money(avgWin)} · Avg loss −$${avgLoss.toFixed(2)}`,'muted']
 ])}
 <section class="panel" style="margin-bottom:16px">
  <div class="table-wrap"><table id="historyTable"><thead><tr><th>Stock</th><th>Side</th><th>Entry date</th><th>Exit date</th><th class="right">Qty</th><th class="right">Entry price</th><th class="right">Exit price</th><th class="right">Realised P/L</th><th class="right">Return</th><th>Outcome</th></tr></thead><tbody>${rows}</tbody></table></div>
 </section>
 <div class="grid two">
  <section class="panel"><div class="panel-head"><div class="panel-title">Trade outcomes</div><span class="muted small">Closed trades only</span></div>
   <div class="row"><div><span class="pill">Wins</span><span class="muted small"> &nbsp; Profitable trades</span></div><b class="positive">${wins} <span class="muted small">(${Math.round(wins/closedTrades.length*100)}%)</span></b></div>
   <div class="bar"><span style="width:${wins/closedTrades.length*100}%;background:var(--green)"></span></div>
   <div class="row"><div><span class="pill bad">Losses</span><span class="muted small"> &nbsp; Unprofitable trades</span></div><b class="negative">${losses} <span class="muted small">(${Math.round(losses/closedTrades.length*100)}%)</span></b></div>
   <div class="bar"><span style="width:${losses/closedTrades.length*100}%;background:var(--red)"></span></div>
   <div class="row"><span class="muted">Average holding period</span><b>26 days</b></div>
  </section>

 width:'100%',height:400,colorTheme:'dark',isTransparent:false,backgroundColor:'#111a2b',showSymbolLogo:true,locale:'en',

function mountMarketData(){

// Daily OHLC for the watchlist charts. The API has no price-history endpoint yet, so candles are
// generated per ticker (seeded, so they're stable) and end at the card's price and day change.
function seededRandom(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sessionDates(count,last){const dates=[];const d=new Date(last+'T00:00:00Z');while(dates.length<count){const day=d.getUTCDay();if(day!==0&&day!==6)dates.unshift(d.toISOString().slice(0,10));d.setUTCDate(d.getUTCDate()-1)}return dates}
function dailyCandles(ticker,price,changePct,count=90){
 const rand=seededRandom([...ticker].reduce((h,c)=>h*31+c.charCodeAt(0),7));
 const closes=new Array(count);closes[count-1]=price;closes[count-2]=price/(1+changePct/100);
 for(let i=count-2;i>0;i--)closes[i-1]=closes[i]/(1+(rand()-.47)*.04);
 return sessionDates(count,'2026-10-23').map((time,i)=>{
  const close=closes[i],open=i===0?close*(1+(rand()-.5)*.02):closes[i-1]*(1+(rand()-.5)*.006);
  const high=Math.max(open,close)*(1+rand()*.012),low=Math.min(open,close)*(1-rand()*.012);
  return{time,open,high,low,close};
 });
}
let watchCharts=[];
function mountWatchCharts(){
 if(!window.LightweightCharts)return;
 const {createChart,CandlestickSeries,ColorType,CrosshairMode}=LightweightCharts;
 document.querySelectorAll('[data-candles]').forEach(el=>{
  const chart=createChart(el,{
   autoSize:true,
   layout:{background:{type:ColorType.Solid,color:'transparent'},textColor:'#94a3b8',fontSize:10,fontFamily:'Inter, Roboto, "Segoe UI", Arial, sans-serif'},
   grid:{vertLines:{visible:false},horzLines:{color:'#1f2a3f'}},
   rightPriceScale:{borderVisible:false,scaleMargins:{top:.1,bottom:.08}},
   timeScale:{borderVisible:false,fixLeftEdge:true,fixRightEdge:true},
   crosshair:{mode:CrosshairMode.Magnet},
   // Cards sit in a scrolling page; don't capture wheel or touch gestures.
   handleScroll:false,handleScale:false
  });
  const series=chart.addSeries(CandlestickSeries,{upColor:'#4cdbab',downColor:'#ff8194',wickUpColor:'#4cdbab',wickDownColor:'#ff8194',borderVisible:false,priceLineVisible:false});
  const price=Number(el.dataset.price.replace(/[^0-9.]/g,'')),change=Number(el.dataset.change.replace('−','-').replace(/[^0-9.+-]/g,''));
  series.setData(dailyCandles(el.dataset.candles,price,change));
  chart.timeScale().fitContent();
  watchCharts.push(chart);
 });
}
